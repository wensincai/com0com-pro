[package]
name = "ccp-cli"
description = "com0com-pro command line tool (ccp.exe)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ccp"
path = "src/main.rs"

[dependencies]
ccp-core = { path = "../ccp-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
